# ethereum-package args for e2e/devnet: one geth + Lighthouse participant on a mainnet-preset devnet with
# Electra and Fulu at genesis. Genesis has 64 validators; the Kurtosis VC loads keys 0..55 only.
# devnet.sh derives keys 56..63 from the same mnemonic and splits them into the 3-of-4 charon cluster, so
# no Kurtosis VC ever holds a DV key.
participants:
  - el_type: geth
    el_image: ethereum/client-go:v1.17.10
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.3.3
    vc_type: lighthouse
    vc_image: sigp/lighthouse:v8.3.3
    validator_count: 56
    supernode: true # Fulu at genesis needs full PeerDAS custody with a single CL
    el_max_mem: 1536
    cl_max_mem: 2048
    vc_max_mem: 512
network_params:
  preset: mainnet
  seconds_per_slot: 12
  preregistered_validator_count: 64
  # The package's default mnemonic, stated here because devnet.sh derives the DV keys from it.
  preregistered_validator_keys_mnemonic: "giant issue aisle success illegal bike spike question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy very lucky have athlete"
  electra_fork_epoch: 0
  fulu_fork_epoch: 0
  gloas_fork_epoch: 18446744073709551615
  genesis_delay: 60
additional_services: []
