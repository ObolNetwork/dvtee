# Bring-up only: verbose systemd and udev logging on the serial console.
# Still no shell or login. The command line differs, so the measurement and
# the sealing key differ from the release image: a debug guest can never
# open a release guest's disk.
[Content]
KernelCommandLine=
        systemd.log_level=debug
        rd.systemd.log_level=debug
        udev.log_level=info
        rd.udev.log_level=info
        systemd.show_status=1
