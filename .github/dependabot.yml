version: 2
updates:
- package-ecosystem: "cargo"
  directory: "/signer"
  schedule:
    interval: "daily"
  cooldown:
    default-days: 7
  # A dependency goes to the first group that matches it; one that matches
  # none gets a PR of its own. Patch bumps of ordinary crates come together.
  # Minor and major bumps come one per PR: a 0.x minor (axum-server 0.8 to
  # 0.9) is a breaking change. The exactly pinned crypto crates (Cargo.toml)
  # always come one per PR, except the RustCrypto family, which shares
  # traits (digest, cipher) and has to move together.
  groups:
    rustcrypto:
      patterns:
        - "aes"
        - "ctr"
        - "hmac"
        - "pbkdf2"
        - "scrypt"
        - "sha2"
    cargo-patch:
      patterns:
        - "*"
      exclude-patterns:
        - "blst"
        - "rcgen"
        - "ring"
        - "rustls"
        - "rustls-native-certs"
        - "unicode-normalization"
        - "x509-cert"
        - "zeroize"
      update-types:
        - "patch"
- package-ecosystem: "gomod"
  directory: "/signer/tests/vecgen"
  schedule:
    interval: "daily"
  cooldown:
    default-days: 7
  ignore:
  # Keep in lockstep with charon, which pins the same minor.
  - dependency-name: "github.com/herumi/bls-eth-go-binary"
    update-types: ["version-update:semver-major","version-update:semver-minor"]
  # Replaced by the ObolNetwork fork in go.mod; bumping the require is a no-op.
  - dependency-name: "github.com/attestantio/go-eth2-client"
  groups:
    go-dependencies:
      patterns:
        - "*"
- package-ecosystem: "docker"
  directories:
    - "/"
    - "/signer"
  schedule:
    interval: "daily"
  cooldown:
    default-days: 7
  groups:
    docker-dependencies:
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
        - "*"
