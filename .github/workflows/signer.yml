name: signer

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "signer/**"
      - ".github/workflows/signer.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: signer
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked --features insecure-dev -- -D warnings
      - run: cargo test --locked --features insecure-dev
      # The load test tool (docs/load-test.md).
      - run: cargo clippy --all-targets --locked --all-features -- -D warnings
      - run: cargo test --locked --features load-test
      # Consensus spec tests and ssz-specs vectors: the pinned archives are
      # streamed once (~1 GB, only ~1 MB extracted) and cached by script hash.
      - name: Cache spec tests
        id: spec-tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: signer/spec-tests
          key: spec-tests-${{ hashFiles('signer/scripts/fetch-spec-tests.sh') }}
      - name: Fetch spec tests
        if: steps.spec-tests.outputs.cache-hit != 'true'
        run: scripts/fetch-spec-tests.sh
      - name: Spec tests
        run: cargo test --locked --test spec_tests -- --nocapture
        env:
          SPEC_TESTS_DIR: ${{ github.workspace }}/signer/spec-tests
      # EIP-3076 interchange tests: a small pinned archive, cached by script hash.
      - name: Cache interchange tests
        id: interchange-tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: signer/interchange-tests
          key: interchange-tests-${{ hashFiles('signer/scripts/fetch-interchange-tests.sh') }}
      - name: Fetch interchange tests
        if: steps.interchange-tests.outputs.cache-hit != 'true'
        run: scripts/fetch-interchange-tests.sh
      - name: Interchange tests
        run: cargo test --locked --test interchange_tests -- --nocapture
        env:
          INTERCHANGE_TESTS_DIR: ${{ github.workspace }}/signer/interchange-tests
